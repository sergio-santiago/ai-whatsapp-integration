name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any earlier run on the same branch rather than duplicate the work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege globally. A job that needs more asks for it itself.
permissions:
  contents: read

env:
  # Type stripping is only stable from 24.12, so this is also the floor
  # declared in package.json engines.
  NODE_VERSION: "24"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1) TYPECHECK: the compiler never runs at runtime, so this is the
  #    only thing standing between a type error and production
  # ────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ────────────────────────────────────────────────────────────────
  # 2) TEST: the whole suite on the LTS line and on current. Node 22
  #    is absent on purpose: it cannot execute TypeScript sources
  # ────────────────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test --test-reporter=spec

      - name: Report coverage in the job summary
        run: |
          summary=$(node --test --experimental-test-coverage --test-reporter=tap \
            | grep -E '^# all files' || true)
          {
            echo "### Coverage on Node ${{ matrix.node-version }}"
            echo
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────
  # 3) AUDIT: the project ships one runtime dependency, so keeping it
  #    clean is cheap and there is no excuse for a known high
  # ────────────────────────────────────────────────────────────────
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check the lockfile is in step with package.json
        run: npm ci --dry-run

  # ────────────────────────────────────────────────────────────────
  # 4) DOCKER: building the image proves it compiles, not that it
  #    runs. This starts it and asks it whether it is alive
  # ────────────────────────────────────────────────────────────────
  docker:
    name: Image builds and serves
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t messaging-llm-bridge:ci .

      - name: Refuse to run as root
        run: |
          container_user=$(docker run --rm messaging-llm-bridge:ci id -un)
          echo "container user: $container_user"
          test "$container_user" = "node"

      - name: Start the service
        run: |
          docker run -d --name bridge -p 3000:3000 \
            -e CHANNELS=telegram \
            -e TELEGRAM_BOT_TOKEN=ci-token \
            -e TELEGRAM_WEBHOOK_SECRET=ci-secret \
            -e AI_PROVIDER=ollama \
            messaging-llm-bridge:ci

      - name: Wait for the liveness probe
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "alive after $attempt attempts"
              exit 0
            fi
            sleep 1
          done
          echo "never became alive"
          docker logs bridge
          exit 1

      - name: Readiness probe answers
        run: curl -fsS http://127.0.0.1:3000/ready

      - name: Unsigned webhook is rejected
        run: |
          http_status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/webhooks/telegram \
            -H 'content-type: application/json' -d '{}')
          echo "status: $http_status"
          test "$http_status" = "403"

      - name: Shuts down on SIGTERM without being killed
        run: |
          start=$(date +%s)
          docker stop bridge > /dev/null
          elapsed=$(( $(date +%s) - start ))
          exit_code=$(docker inspect bridge --format '{{.State.ExitCode}}')
          echo "stopped in ${elapsed}s with exit code $exit_code"
          # Docker SIGKILLs after stop_grace_period. Exiting well inside it,
          # with status 0, is what proves the signal handler ran.
          test "$exit_code" = "0"
          test "$elapsed" -lt 20

      - name: Container logs
        if: always()
        run: docker logs bridge || true
